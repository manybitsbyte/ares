<style>
  :root {
    color-scheme: light dark;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  body {
    margin: 0;
    background: #17181b;
    color: #f2f2f2;
  }

  main {
    box-sizing: border-box;
    display: grid;
    gap: 16px;
    width: min(100%, 960px);
    margin: 0 auto;
    padding: 20px;
  }

  header,
  .controls,
  .keyboard {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  header {
    justify-content: space-between;
  }

  h1 {
    margin: 0;
    font: inherit;
    font-size: 18px;
    font-weight: 600;
  }

  button,
  input::file-selector-button {
    min-height: 34px;
    padding: 6px 11px;
    border: 1px solid #555a66;
    border-radius: 5px;
    background: #292c33;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }

  button:disabled {
    cursor: default;
    opacity: 0.45;
  }

  button:focus-visible,
  input:focus-visible {
    outline: 2px solid #9cbcff;
    outline-offset: 2px;
  }

  input[type="file"] {
    max-width: 100%;
    font: inherit;
  }

  .screen {
    display: grid;
    place-items: center;
    min-height: 300px;
    overflow: hidden;
    border: 1px solid #3e424a;
    border-radius: 7px;
    background: #050505;
  }

  canvas {
    display: block;
    width: min(100%, calc(70vh * 4 / 3));
    height: auto;
    aspect-ratio: 4 / 3;
    image-rendering: pixelated;
  }

  #status {
    margin: 0;
    color: #bfc5d2;
  }

  #status.error {
    color: #ff9b9b;
  }

  .keyboard {
    color: #bfc5d2;
    font-size: 13px;
  }

  kbd {
    padding: 2px 5px;
    border: 1px solid #555a66;
    border-bottom-width: 2px;
    border-radius: 4px;
    background: #292c33;
    color: #f2f2f2;
  }

  @media (max-width: 600px) {
    main { padding: 12px; }
    .screen { min-height: 220px; }
  }
</style>

<main>
  <header>
    <h1>ares · Neo Geo AES WASM</h1>
    <p id="status" role="status">Loading core…</p>
  </header>

  <div class="screen">
    <canvas id="video" width="320" height="256" aria-label="Neo Geo video output"></canvas>
  </div>

  <!--the AES needs its system ROM before any cartridge: the BIOS input accepts either a raw
      neo-epo.bin-style dump or a MAME aes.zip, which ares_ng_set_bios tells apart by content.
      A .neo cartridge names its own layout; a MAME romset zip must be loaded under its database
      name, which the name field carries and the file picker pre-fills from the zip's basename.-->
  <div class="controls">
    <label>BIOS <input id="bios" type="file" accept=".bin,.rom,.zip" aria-label="Choose an AES BIOS (neo-epo.bin or aes.zip)"></label>
    <input id="rom" type="file" accept=".neo,.zip" aria-label="Choose a Neo Geo cartridge (.neo or MAME romset zip)">
    <label>Romset name <input id="romset" type="text" size="10" placeholder="mslug" aria-label="MAME romset name (ignored for .neo)"></label>
  </div>

  <div class="controls">
    <button id="load" type="button" disabled>Load ROM</button>
    <button id="pause" type="button" disabled>Pause</button>
    <button id="restart" type="button" disabled>Restart</button>
    <label><input id="sound" type="checkbox" checked> Sound</label>
  </div>

  <!--state only: the AES's single writable medium is the memory card, which ares gives no pak, so
      there is deliberately no battery/save-ram row here (see wasm/ng.cpp on the absent ABI)-->
  <div class="controls">
    <button id="stateSave" type="button" disabled>Save state</button>
    <button id="stateRestore" type="button" disabled>Restore state</button>
    <button id="stateDownload" type="button" disabled>Download state</button>
    <label>Load state <input id="stateFile" type="file" accept=".bs0,.bs1,.bs2,.bs3,.bs4,.bs5,.bs6,.bs7,.bs8,.bs9,.bsu,.blu" aria-label="Load a save state from a file"></label>
  </div>

  <div class="keyboard" aria-label="Keyboard controls">
    <span><kbd>Arrows</kbd> D-pad</span>
    <span><kbd>Z</kbd>/<kbd>X</kbd>/<kbd>C</kbd>/<kbd>V</kbd> A/B/C/D</span>
    <span><kbd>Shift</kbd> Select</span>
    <span><kbd>Enter</kbd> Start</span>
  </div>
</main>

<script type="module">
  //the ng core builds into its own tree (build_wasm_ng), unlike the cores that share build_wasm
  const moduleUrl = new URL("../build_wasm_ng/wasm/ares-ng.mjs", location.href);
  moduleUrl.search = location.search;
  const locateFile = path => {
    const url = new URL(path, moduleUrl);
    url.search = location.search;
    return url.href;
  };
  const status = document.getElementById("status");
  const canvas = document.getElementById("video");
  const context = canvas.getContext("2d", {alpha: false});
  const biosInput = document.getElementById("bios");
  const romInput = document.getElementById("rom");
  const romsetInput = document.getElementById("romset");
  const loadButton = document.getElementById("load");
  const pauseButton = document.getElementById("pause");
  const restartButton = document.getElementById("restart");
  const soundInput = document.getElementById("sound");
  const stateSaveButton = document.getElementById("stateSave");
  const stateRestoreButton = document.getElementById("stateRestore");
  const stateDownloadButton = document.getElementById("stateDownload");
  const stateFileInput = document.getElementById("stateFile");

  //wasm/ng.cpp's Button enum, in order; one AES arcade stick per player
  const buttons = {
    ArrowUp: 1 << 0,
    ArrowDown: 1 << 1,
    ArrowLeft: 1 << 2,
    ArrowRight: 1 << 3,
    KeyZ: 1 << 4,
    KeyX: 1 << 5,
    KeyC: 1 << 6,
    KeyV: 1 << 7,
    ShiftLeft: 1 << 8,
    ShiftRight: 1 << 8,
    Enter: 1 << 9,
  };

  let core;
  let bios;
  let rom;
  let running = false;
  let inputMask = 0;
  let nextFrame = performance.now();
  //6 MHz LSPC / (384 * 264) clocks per frame; the AES has no PAL personality to detect
  const frameDuration = 1000 / 59.185606;
  let audioContext;
  let audioTime = 0;
  let frameCount = 0;
  let coreTime = 0;
  let drawCount = 0;
  let drawTime = 0;
  let statsTime = performance.now();
  let romName = "";
  let videoImage;
  let videoWords;
  const audioSources = new Set();
  let stateBytes = null;

  function saveFile(bytes, name) {
    const url = URL.createObjectURL(new Blob([bytes], {type: "application/octet-stream"}));
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = name;
    anchor.click();
    //revoking straight away races the download in some browsers
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  function romBaseName() {
    return (romInput.files[0]?.name ?? "ares").replace(/\.[^.]*$/, "");
  }

  //synchronize != 0 runs the scheduler to a safe point before serializing, which is what makes the
  //bytes a desktop slot file rather than a page-local snapshot; the .bs1 name follows the other
  //previews, and the same desktop-ui/program/states.cpp reasoning they cite.
  function saveState() {
    core._ares_ng_state_save(1);
    const size = core._ares_ng_state_size();
    if(!size) throw new Error(core.UTF8ToString(core._ares_ng_error()) || "Could not save the state");
    stateBytes = new Uint8Array(core.HEAPU8.buffer, core._ares_ng_state_data(), size).slice();
    stateRestoreButton.disabled = false;
    stateDownloadButton.disabled = false;
    setStatus(`Saved a ${size.toLocaleString()}-byte state`);
  }

  function restoreState(bytes) {
    const pointer = core._ares_ng_alloc(bytes.length);
    try {
      core.HEAPU8.set(bytes, pointer);
      if(!core._ares_ng_state_load(pointer, bytes.length)) {
        throw new Error(core.UTF8ToString(core._ares_ng_error()));
      }
    } finally {
      core._ares_ng_free(pointer);
    }
    stopAudio();
    nextFrame = performance.now();
    setStatus(`Restored a ${bytes.length.toLocaleString()}-byte state`);
  }

  function setStatus(message, error = false) {
    status.textContent = message;
    status.classList.toggle("error", error);
  }

  function stopAudio() {
    for(const source of audioSources) source.stop();
    audioSources.clear();
    audioTime = 0;
  }

  async function enableAudio() {
    audioContext ??= new AudioContext();
    if(audioContext.state === "suspended") await audioContext.resume();
  }

  function queueAudio() {
    if(!soundInput.checked || !audioContext) return;
    const frames = core._ares_ng_audio_frames();
    if(!frames) return;

    const pointer = core._ares_ng_audio_data();
    const samples = new Float32Array(core.HEAPU8.buffer, pointer, frames * 2);
    const buffer = audioContext.createBuffer(2, frames, audioContext.sampleRate);
    const left = buffer.getChannelData(0);
    const right = buffer.getChannelData(1);
    for(let frame = 0; frame < frames; frame++) {
      left[frame] = samples[frame * 2];
      right[frame] = samples[frame * 2 + 1];
    }

    const source = audioContext.createBufferSource();
    source.buffer = buffer;
    source.connect(audioContext.destination);
    source.onended = () => audioSources.delete(source);
    audioSources.add(source);

    if(audioTime < audioContext.currentTime || audioTime > audioContext.currentTime + 0.2) {
      audioTime = audioContext.currentTime + 0.025;
    }
    source.start(audioTime);
    audioTime += buffer.duration;
  }

  function drawFrame() {
    const started = performance.now();
    const width = core._ares_ng_video_width();
    const height = core._ares_ng_video_height();
    if(!width || !height) return;
    if(canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
      videoImage = null;
    }
    if(!videoImage) {
      videoImage = context.createImageData(width, height);
      videoWords = new Uint32Array(videoImage.data.buffer);
    }

    const source = core._ares_ng_video_data();
    const pixels = new Uint32Array(core.HEAPU8.buffer, source, width * height);
    for(let pixel = 0; pixel < pixels.length; pixel++) {
      const color = pixels[pixel];
      videoWords[pixel] = 0xff000000 | (color & 0xff) << 16 | color & 0xff00 | color >> 16 & 0xff;
    }
    context.putImageData(videoImage, 0, 0);
    drawCount++;
    drawTime += performance.now() - started;
  }

  function runFrame(draw = true) {
    const started = performance.now();
    core._ares_ng_run_frame();
    coreTime += performance.now() - started;
    frameCount++;
    if(draw) drawFrame();
    queueAudio();
  }

  function animate(now) {
    if(running && soundInput.checked && audioContext) {
      let frames = 0;
      while(audioTime < audioContext.currentTime + 0.08 && frames++ < 6) runFrame(false);
      if(frames) drawFrame();
    } else if(running && now >= nextFrame) {
      runFrame();
      nextFrame += frameDuration;
      if(nextFrame < now - frameDuration) nextFrame = now + frameDuration;
    }
    if(running && now - statsTime >= 1000) {
      setStatus(`${romName} · ${(frameCount * 1000 / (now - statsTime)).toFixed(1)} fps · core ${(coreTime / frameCount).toFixed(1)} ms · draw ${(drawTime / drawCount).toFixed(1)} ms · ${audioContext.sampleRate} Hz`);
      frameCount = 0;
      coreTime = 0;
      drawCount = 0;
      drawTime = 0;
      statsTime = now;
    }
    requestAnimationFrame(animate);
  }

  function put(bytes) {
    const pointer = core._ares_ng_alloc(bytes.length);
    core.HEAPU8.set(bytes, pointer);
    return pointer;
  }

  async function loadRom() {
    if(!rom || !bios) return;
    running = false;
    stopAudio();
    setStatus(`Loading ${romInput.files[0]?.name ?? "ROM"}…`);
    await enableAudio();
    core._ares_ng_set_audio_frequency(audioContext.sampleRate);

    //the BIOS survives ares_ng_unload, exactly as a console keeps its system ROM across
    //cartridges, but handing it over on every load keeps the page stateless about it
    const biosPointer = put(bios);
    core._ares_ng_set_bios(biosPointer, bios.length);
    core._ares_ng_free(biosPointer);

    const romPointer = put(rom);
    //a .neo needs no name (ng.cpp detects the container); a MAME zip must be named for mia's
    //database, or every romset would load as whatever the zip happened to be called
    const name = romsetInput.value.trim();
    const namePointer = name ? put(new TextEncoder().encode(`${name}\0`)) : 0;
    try {
      if(!core._ares_ng_load(romPointer, rom.length, namePointer)) {
        throw new Error(core.UTF8ToString(core._ares_ng_error()));
      }
    } finally {
      core._ares_ng_free(romPointer);
      if(namePointer) core._ares_ng_free(namePointer);
    }

    inputMask = 0;
    core._ares_ng_set_input(0, 0);
    core._ares_ng_set_input(1, 0);
    running = true;
    romName = romInput.files[0]?.name ?? "Running";
    frameCount = 0;
    coreTime = 0;
    drawCount = 0;
    drawTime = 0;
    statsTime = performance.now();
    nextFrame = performance.now();
    pauseButton.disabled = false;
    restartButton.disabled = false;
    stateBytes = null;
    stateSaveButton.disabled = false;
    stateRestoreButton.disabled = true;
    stateDownloadButton.disabled = true;
    pauseButton.textContent = "Pause";
    setStatus(romName);
  }

  stateSaveButton.addEventListener("click", () => {
    try { saveState(); } catch(error) { setStatus(error.message, true); }
  });

  stateRestoreButton.addEventListener("click", () => {
    if(!stateBytes) return;
    try { restoreState(stateBytes); } catch(error) { setStatus(error.message, true); }
  });

  stateDownloadButton.addEventListener("click", () => {
    if(stateBytes) saveFile(stateBytes, `${romBaseName()}.bs1`);
  });

  stateFileInput.addEventListener("change", async () => {
    const file = stateFileInput.files[0];
    if(file) {
      try {
        restoreState(new Uint8Array(await file.arrayBuffer()));
      } catch(error) {
        setStatus(error.message, true);
      }
    }
    //clearing it means picking the same file twice in a row still fires a change
    stateFileInput.value = "";
  });

  function updateLoadButton() {
    loadButton.disabled = !core || !rom || !bios;
  }

  biosInput.addEventListener("change", async () => {
    const file = biosInput.files[0];
    bios = file ? new Uint8Array(await file.arrayBuffer()) : null;
    updateLoadButton();
  });

  romInput.addEventListener("change", async () => {
    const file = romInput.files[0];
    rom = file ? new Uint8Array(await file.arrayBuffer()) : null;
    //a MAME romset only loads under its database name; the zip's basename is that name in every
    //conventionally-kept set, so pre-fill it and leave it editable. a .neo ignores the field.
    if(file && /\.zip$/i.test(file.name)) romsetInput.value = file.name.replace(/\.[^.]*$/, "");
    updateLoadButton();
  });

  loadButton.addEventListener("click", () => loadRom().catch(error => {
    running = false;
    setStatus(error.message, true);
  }));

  restartButton.addEventListener("click", () => loadRom().catch(error => {
    running = false;
    setStatus(error.message, true);
  }));

  pauseButton.addEventListener("click", () => {
    running = !running;
    pauseButton.textContent = running ? "Pause" : "Resume";
    if(running) nextFrame = performance.now();
    else stopAudio();
  });

  soundInput.addEventListener("change", () => {
    if(!soundInput.checked) stopAudio();
    else enableAudio();
  });

  function updateInput(event, pressed) {
    const bit = buttons[event.code];
    if(!bit || !core) return;
    event.preventDefault();
    inputMask = pressed ? inputMask | bit : inputMask & ~bit;
    core._ares_ng_set_input(0, inputMask);
  }

  addEventListener("keydown", event => updateInput(event, true));
  addEventListener("keyup", event => updateInput(event, false));
  addEventListener("blur", () => {
    inputMask = 0;
    core?._ares_ng_set_input(0, 0);
  });

  try {
    const {default: createAresNg} = await import(moduleUrl);
    core = await createAresNg({locateFile});
    updateLoadButton();
    setStatus("Core ready — choose a BIOS and a ROM");
  } catch(error) {
    setStatus(`Could not start the core: ${error.message}`, true);
  }

  requestAnimationFrame(animate);
</script>
